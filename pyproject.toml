[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sniper-paper"
version = "0.1.0"
description = "Public-data-only Bybit forward paper strategy evaluator"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31,<3",
  "websockets>=14,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
sniper-paper = "sniper_paper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sniper_paper = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
